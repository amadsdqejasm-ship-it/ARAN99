<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARAN Wheel</title>

<style>
body{
  background:#111;
  color:white;
  text-align:center;
  font-family:Arial;
}

canvas{
  margin-top:20px;
}

input{
  padding:12px;
  font-size:18px;
  width:70%;
}

button{
  padding:12px 25px;
  font-size:18px;
  margin:10px;
  border-radius:10px;
}

#result{
  font-size:25px;
}
</style>

</head>

<body>

<h1>🎡 چەرخی بەخت ARAN</h1>

<input id="name" placeholder="ناوی بەشداربوو">

<br>

<button onclick="addName()">➕ زیادکردن</button>

<br>

<canvas id="wheel" width="350" height="350"></canvas>

<br>

<button onclick="spin()">🎰 سووڕاندن</button>

<h2 id="result"></h2>


<script>

let canvas=document.getElementById("wheel");
let ctx=canvas.getContext("2d");

let names=[];
let angle=0;
let spinning=false;


function draw(){

let center=175;
let radius=170;

ctx.clearRect(0,0,350,350);


if(names.length){

let part=(Math.PI*2)/names.length;


names.forEach((name,i)=>{

let start=angle+i*part;
let end=start+part;


ctx.beginPath();
ctx.moveTo(center,center);
ctx.arc(center,center,radius,start,end);


ctx.fillStyle=
"hsl("+(i*50)+",80%,50%)";


ctx.fill();

ctx.strokeStyle="white";
ctx.stroke();


ctx.save();

ctx.translate(center,center);
ctx.rotate(start+part/2);

ctx.fillStyle="white";
ctx.font="16px Arial";
ctx.fillText(name,70,5);

ctx.restore();


});

}


// ناوەندی ARAN

ctx.beginPath();
ctx.arc(center,center,55,0,Math.PI*2);
ctx.fillStyle="white";
ctx.fill();


ctx.fillStyle="black";
ctx.font="22px Arial";
ctx.textAlign="center";

ctx.fillText("🛩️",center,165);
ctx.fillText("ARAN",center,195);


}


function addName(){

let n=document.getElementById("name").value;


if(n){

names.push(n);

document.getElementById("name").value="";

draw();

}

}



function spin(){

if(names.length==0){

alert("سەرەتا ناو زیاد بکە");

return;

}


if(spinning)return;

spinning=true;


let win=Math.floor(Math.random()*names.length);


let rounds=8;


angle += rounds*Math.PI*2;


angle += win*((Math.PI*2)/names.length);


let start=Date.now();


function animate(){

let now=Date.now();

let progress=(now-start)/5000;


if(progress<1){

angle +=0.2*(1-progress);

draw();

requestAnimationFrame(animate);

}else{

draw();

document.getElementById("result").innerHTML=
"🏆 براوە: "+names[win];

spinning=false;

}

}

animate();

}


draw();

</script>

</body>
</html>
