<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARAN Lucky Wheel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#8b0000;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

/* Fire Background */

body::before{

content:"";
position:fixed;
left:0;
top:0;
width:100%;
height:100%;

background:

radial-gradient(circle at bottom,#ff3300 0%,transparent 45%),
radial-gradient(circle at top,#660000 0%,#1a0000 80%);

animation:fire 3s infinite alternate;
z-index:-2;

}

@keyframes fire{

0%{

filter:hue-rotate(0deg);
transform:scale(1);

}

100%{

filter:hue-rotate(20deg);
transform:scale(1.08);

}

}

.container{

width:100%;
max-width:430px;
text-align:center;

}

.flag{

font-size:45px;
margin-bottom:10px;

}

h1{

color:white;
margin-bottom:15px;
font-size:28px;

}

#wheelBox{

position:relative;
width:340px;
height:340px;
margin:auto;

}

#wheel{

width:340px;
height:340px;
border-radius:50%;
border:10px solid gold;
background:white;
transition:transform 6s cubic-bezier(.17,.67,.17,1);

}

.center{

position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:90px;
height:90px;
background:black;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
color:red;
font-size:28px;
font-weight:bold;
border:4px solid white;

}

.pointer{

position:absolute;
top:-18px;
left:50%;
transform:translateX(-50%);
font-size:40px;
color:gold;

}

button{

margin-top:25px;
width:90%;
height:55px;
border:none;
border-radius:15px;
font-size:22px;
background:red;
color:white;
font-weight:bold;
cursor:pointer;

}

button:hover{

background:#ff2a2a;

}

#result{

margin-top:20px;
font-size:22px;
color:#fff700;
font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<div class="flag">☀️</div>

<h1>ARAN Lucky Wheel</h1>

<div id="wheelBox">

<div class="pointer">▼</div>

<canvas id="wheel" width="340" height="340"></canvas>

<div class="center">

ARAN

</div>

</div>

<button onclick="spin()">

🎡 سوراندنی چەرخ

</button>

<div id="result">
<div style="margin-top:20px;">

<input
id="nameInput"
type="text"
placeholder="ناو بنووسە..."
style="
width:90%;
height:45px;
border:none;
border-radius:10px;
padding:10px;
font-size:18px;
outline:none;
">

<button onclick="addName()">

➕ زیادکردنی ناو

</button>

<button onclick="clearNames()">

🗑 سڕینەوەی هەموو

</button>

<div id="list"

style="

margin-top:20px;
background:#ffffff22;
padding:15px;
border-radius:15px;
color:white;
font-size:18px;
max-height:180px;
overflow:auto;

">

</div>

</div>
</div>

</div>
<script>
const names = [
"ARAN",
"KARWAN",
"SARA",
"ALI",
"DANA",
"REBIN",
"SHWAN",
"RANYA"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let startAngle = 0;
let spinning = false;

function drawWheel(){

const arc = (Math.PI*2)/names.length;

ctx.clearRect(0,0,340,340);

for(let i=0;i<names.length;i++){

const angle = startAngle + i*arc;

ctx.beginPath();
ctx.moveTo(170,170);
ctx.arc(170,170,170,angle,angle+arc);
ctx.fillStyle=i%2==0?"#ff2b2b":"#b30000";
ctx.fill();

ctx.save();

ctx.translate(170,170);
ctx.rotate(angle+arc/2);

ctx.fillStyle="white";
ctx.font="bold 18px Arial";
ctx.textAlign="right";
ctx.fillText(names[i],145,8);

ctx.restore();

}

}

drawWheel();

function spin(){

if(spinning) return;

spinning=true;

const random=Math.floor(Math.random()*360)+1440;

canvas.style.transform="rotate("+random+"deg)";

setTimeout(()=>{

const degree=random%360;

const arc=360/names.length;

const index=Math.floor(((360-degree)+90)%360/arc);

const loser=names[index];

document.getElementById("result").innerHTML=
"❌ ببورە، <b>"+loser+"</b> دەرکرای لە یاری.";

names.splice(index,1);

if(names.length>1){

canvas.style.transition="none";
canvas.style.transform="rotate(0deg)";
setTimeout(()=>{
canvas.style.transition="transform 6s cubic-bezier(.17,.67,.17,1)";
drawWheel();
spinning=false;
},50);

}else{

document.getElementById("result").innerHTML=
"🏆 براوە: "+names[0];

}

},6000);

}
</script>

</body>
</html>
