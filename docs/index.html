<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  text-align:center;
  font-family:Arial;
  background:#111;
  color:white;
}

#wrapper{
  position:relative;
  width:300px;
  height:300px;
  margin:30px auto;
}

#wheel{
  width:300px;
  height:300px;
  border-radius:50%;
  border:5px solid white;
  position:relative;
  overflow:hidden;
  transition:5s;
  background:conic-gradient(
    #ff4d4d,
    #ffd633,
    #4dff88,
    #4da6ff,
    #cc66ff,
    #ff4d4d
  );
}

.name{
  position:absolute;
  left:50%;
  top:50%;
  transform-origin:0 0;
  font-size:16px;
  font-weight:bold;
  color:white;
}

#logo{
  position:absolute;
  width:80px;
  height:80px;
  background:white;
  color:black;
  border-radius:50%;
  left:110px;
  top:110px;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
}

input{
  padding:10px;
  font-size:18px;
}

button{
  padding:12px 20px;
  margin:10px;
  font-size:18px;
}

</style>
</head>


<body>

<h1>🎡 چەرخی بەخت ARAN</h1>

<input id="name" placeholder="ناوی بەشداربوو">

<br>

<button onclick="addName()">➕ زیادکردن</button>


<div id="wrapper">

<div id="wheel"></div>

<div id="logo">
ARAN
</div>

</div>


<button onclick="spin()">🎡 سووڕاندن</button>

<h2 id="result"></h2>


<script>

let names=[];
let rotation=0;


function addName(){

let n=document.getElementById("name").value;

if(n){

names.push(n);

drawWheel();

document.getElementById("name").value="";

}

}



function drawWheel(){

let wheel=document.getElementById("wheel");

wheel.innerHTML="";


let part=360/names.length;


names.forEach((name,i)=>{

let el=document.createElement("div");

el.className="name";

el.innerHTML=name;

let angle=i*part+part/2;

el.style.transform=
"rotate("+angle+"deg) translate(120px) rotate("+(-angle)+"deg)";

wheel.appendChild(el);

});

}



function spin(){

if(names.length==0){
alert("ناو زیاد بکە");
return;
}


let win=Math.floor(Math.random()*names.length);


rotation+=360*5+(360/names.length)*win;


document.getElementById("wheel").style.transform=
"rotate("+rotation+"deg)";


setTimeout(()=>{

document.getElementById("result").innerHTML=
"🏆 براوە: "+names[win];

},5000);


}


</script>

</body>
</html>
