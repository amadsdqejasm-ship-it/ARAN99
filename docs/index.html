<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎡 چەرخی بەخت</title>

<style>
body {
  text-align: center;
  font-family: Arial;
  background: #222;
  color: white;
}

input {
  padding: 10px;
  width: 80%;
  font-size: 18px;
}

button {
  padding: 12px 25px;
  margin: 10px;
  font-size: 18px;
  border-radius: 10px;
}

#wheel {
  width: 250px;
  height: 250px;
  border-radius: 50%;
  margin: 20px auto;
  background: conic-gradient(
    red,
    yellow,
    green,
    blue,
    purple,
    red
  );
  transition: 5s;
}

#names {
  font-size: 20px;
}
</style>

</head>

<body>

<h1>🎡 چەرخی بەخت</h1>

<input id="name" placeholder="ناوی بەشداربوو بنووسە">

<br>

<button onclick="addName()">➕ زیادکردن</button>

<div id="names"></div>

<div id="wheel"></div>

<button onclick="spin()">🎰 دەستپێکردن</button>

<h2 id="result"></h2>


<script>

let players = [];
let rotate = 0;


function addName(){

let name = document.getElementById("name").value;

if(name){

players.push(name);

document.getElementById("names").innerHTML =
"👥 بەشداربووان:<br>" + players.join("<br>");

document.getElementById("name").value="";

}

}



function spin(){

if(players.length == 0){

alert("سەرەتا ناو زیاد بکە");

return;

}


let random = Math.floor(Math.random()*players.length);

rotate += 1800;

document.getElementById("wheel").style.transform =
"rotate("+rotate+"deg)";


setTimeout(function(){

document.getElementById("result").innerHTML =
"🏆 براوە: " + players[random];

},5000);


}

</script>


</body>
</html>
