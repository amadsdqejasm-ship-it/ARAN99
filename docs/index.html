<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چەرخی بەخت - یاری دەرکردن</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b091a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        h1 {
            margin: 20px 0;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            font-size: 2.2rem;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 500px;
        }

        /* بەشی زیادکردنی ناوەکان */
        .input-section {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 2px solid #ff00ff;
            background-color: #1a153b;
            color: white;
            font-size: 1rem;
            outline: none;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
        }

        input[type="text"]:focus {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
        }

        button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* لیستی ناوەکان */
        .names-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
            max-height: 120px;
            overflow-y: auto;
            padding: 5px;
            background: rgba(25, 20, 50, 0.6);
            border-radius: 8px;
            border: 1px solid #332b69;
        }

        .name-tag {
            background-color: #2b1f5e;
            border: 1px solid #ff00ff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 5px rgba(255, 0, 255, 0.3);
        }

        .name-tag span {
            cursor: pointer;
            color: #ff4d4d;
            font-weight: bold;
        }

        /* چەرخ و نیشانە */
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px 0;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ffff00;
            z-index: 10;
            filter: drop-shadow(0 0 8px rgba(255, 255, 0, 0.8));
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.4), inset 0 0 15px rgba(255, 0, 255, 0.4);
            border: 6px solid #1a153b;
        }

        .spin-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            background: linear-gradient(45deg, #00ffcc, #0077ff);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            border-radius: 10px;
        }

        /* پەنجەرەی ئەنجام (Popup) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a153b, #2b1f5e);
            border: 2px solid #ff0055;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.6);
            max-width: 90%;
            width: 350px;
            animation: popIn 0.4s ease;
        }

        .modal-content h2 {
            color: #ff4d4d;
            margin-bottom: 15px;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
        }

        .modal-content p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-content button {
            background: #ff0055;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
            width: 100%;
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>چەرخی بەخت</h1>

    <div class="container">
        <!-- زیادکردنی ناو -->
        <div class="input-section">
            <input type="text" id="nameInput" placeholder="ناوی بەشداربوو بنووسە..." autocomplete="off">
            <button onclick="addName()">زیادکردن</button>
        </div>

        <!-- لیستی ناوەکان -->
        <div class="names-list" id="namesList"></div>

        <!-- چەرخەکە -->
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel" width="400" height="400"></canvas>
        </div>

        <!-- دوگمەی سوڕاندن -->
        <button class="spin-btn" onclick="spinWheel()" id="spinBtn">سوڕاندنی چەرخ</button>
    </div>

    <!-- پەنجەرەی نیشاندانی دەرکراو -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2>ئاگاداری!</h2>
            <p id="resultText"></p>
            <button onclick="closeModal()">باشە</button>
        </div>
    </div>

    <script>
        let names = ["ئاماد", "کاروان", "ژیلان", "سنور", "ڕێبین"]; // نموونەی سەرەتایی
        let startAngle = 0;
        let arc = 0;
        let spinTimeout = null;
        let spinArcStart = 10;
        let spinTime = 0;
        let spinTimeTotal = 0;
        let isSpinning = false;

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");

        const colors = [
            "#ff0055", "#00ffff", "#ff00ff", "#00ffcc", 
            "#ff9900", "#9900ff", "#00ccff", "#ff0066"
        ];

        function drawWheel() {
            arc = Math.PI / (names.length > 0 ? names.length / 2 : 1);
            ctx.clearRect(0, 0, 400, 400);

            if (names.length === 0) {
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 18px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("تکایە ناو زیاد بکە", 200, 200);
                return;
            }

            for (let i = 0; i < names.length; i++) {
                let angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % colors.length];

                ctx.beginPath();
                ctx.arc(200, 200, 190, angle, angle + arc, false);
                ctx.arc(200, 200, 0, angle + arc, angle, true);
                ctx.fill();

                ctx.save();
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px sans-serif";
                ctx.translate(
                    200 + Math.cos(angle + arc / 2) * 120,
                    200 + Math.sin(angle + arc / 2) * 120
                );
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                let text = names[i];
                ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
                ctx.restore();
            }
        }

        function addName() {
            if (isSpinning) return;
            const input = document.getElementById("nameInput");
            const name = input.value.trim();
            if (name !== "") {
                names.push(name);
                input.value = "";
                updateNamesList();
                drawWheel();
            }
        }

        function removeName(index) {
            if (isSpinning) return;
            names.splice(index, 1);
            updateNamesList();
            drawWheel();
        }

        function updateNamesList() {
            const listDiv = document.getElementById("namesList");
            listDiv.innerHTML = "";
            names.forEach((name, index) => {
                let tag = document.createElement("div");
                tag.className = "name-tag";
                tag.innerHTML = `${name} <span onclick="removeName(${index})">&times;</span>`;
                listDiv.appendChild(tag);
            });
        }

        function spinWheel() {
            if (isSpinning || names.length === 0) return;
            isSpinning = true;
            document.getElementById("spinBtn").style.opacity = "0.5";
            
            spinArcStart = Math.random() * 10 + 10;
            spinTime = 0;
            spinTimeTotal = Math.random() * 3000 + 4000;
            rotateWheel();
        }

        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            let spinAngle = spinArcStart - easeOut(spinTime, 0, spinArcStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI) / 180;
            drawWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function stopRotateWheel() {
            isSpinning = false;
            document.getElementById("spinBtn").style.opacity = "1";
            clearTimeout(spinTimeout);

            let degrees = (startAngle * 180) / Math.PI + 90;
            let arcd = (arc * 180) / Math.PI;
            let index = Math.floor((360 - (degrees % 360)) / arcd);
            index = (index + names.length) % names.length;

            let eliminatedName = names[index];
            
            // پیشاندانی پەیامی دەرکردن
            showModal(eliminatedName);
            
            // لابردنی ناوەکە لە چەرخەکە دوای دەرچوونی
            names.splice(index, 1);
            updateNamesList();
            drawWheel();
        }

        function easeOut(t, b, c, d) {
            let ts = (t /= d) * t;
            let tc = ts * t;
            return b + c * (tc + -3 * ts + 3 * t);
        }

        function showModal(name) {
            const modal = document.getElementById("resultModal");
            const resultText = document.getElementById("resultText");
            resultText.innerHTML = `ببورە <span style="color: #00ffff; font-weight: bold;">${name}</span> تو دەرکرای لە یاری!`;
            modal.style.display = "flex";
        }

        function closeModal() {
            document.getElementById("resultModal").style.display = "none";
        }

        // باری سەرەتایی
        updateNamesList();
        drawWheel();
    </script>
</body>
</html>
